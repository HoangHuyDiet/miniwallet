spring:
  application:
    name: miniwallet
  datasource:
    url: ${URL_DB}
    username: postgres
    password: ${PASSWORD_DB}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
      idle-timeout: 600000
      connection-test-query: SELECT 1
      pool-name: HikariPool-MiniWallet
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

jwt:
  secret: ${SECRET_KEY}
  expiration: 3600000

logging:
  level:
    org:
      hibernate:
        orm:
          jdbc:
            bind: trace

